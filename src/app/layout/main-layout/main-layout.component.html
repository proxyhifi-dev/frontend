<div class="app-container" [class.live-mode]="(modeStore.isLive$ | async)">

  <app-command-palette></app-command-palette>

  <header class="top-bar glass-card">
    <div class="left-section">
      <div class="page-meta">
        <div class="page-title">{{ pageTitle }}</div>
        <div class="breadcrumb">{{ breadcrumb }}</div>
      </div>
    </div>

    <div class="center-section">
      <form class="search-form" (ngSubmit)="submitSearch()">
        <span class="icon" aria-hidden="true">🔍</span>
        <input
          type="search"
          name="searchQuery"
          class="search-input"
          placeholder="Search symbol"
          aria-label="Search symbol"
          [(ngModel)]="searchQuery"
          (input)="store.setSearchSymbol(searchQuery)"
        >
        <button type="submit" class="search-btn">Search</button>
        <button type="button" class="search-clear" (click)="clearSearch()" [disabled]="!searchQuery" aria-label="Clear search">
          ✕
        </button>
      </form>
    </div>

    <div class="right-section desktop-only">
      <button
        type="button"
        class="mode-toggle"
        (click)="toggleMode()"
        [attr.aria-pressed]="(modeStore.isLive$ | async)"
        aria-label="Toggle paper or live mode"
      >
        <div class="toggle-pill">
          <span class="label paper">PAPER</span>
          <span class="label live">LIVE</span>
          <div class="slider"></div>
        </div>
      </button>
      <button
        type="button"
        class="status-chip"
        [class.connected]="isConnected"
        (click)="handleConnectionClick()"
        aria-label="Broker connection status"
      >
        <span class="dot"></span>
        {{ isConnected ? 'Connected' : 'Disconnected' }}
      </button>
      <button class="icon-btn notification" type="button" aria-label="Notifications">
        🔔
        <span class="dot" *ngIf="unreadCount > 0" aria-hidden="true"></span>
      </button>
      <button class="profile-pill" type="button" aria-label="Open profile menu">T</button>
    </div>
  </header>

  <app-sidebar class="sidebar-area desktop-only"
               [class.collapsed]="(store.state$ | async)?.isSidebarCollapsed">
  </app-sidebar>

  <main class="content-area">
    <section class="status-banner">
      <div class="status-item">
        <span class="label">Mode</span>
        <span class="value">{{ (modeStore.mode$ | async) || 'PAPER' }}</span>
      </div>
      <div class="status-item">
        <span class="label">Data Source</span>
        <span class="value">{{ dataSource }}</span>
      </div>
      <div class="status-item">
        <span class="label">Last Updated</span>
        <span class="value">{{ lastUpdated ? (lastUpdated | date:'short') : '—' }}</span>
      </div>
      <div class="status-item">
        <span class="label">Connection</span>
        <button
          type="button"
          class="status-chip"
          [class.connected]="isConnected"
          (click)="handleConnectionClick()"
        >
          <span class="dot"></span>
          {{ isConnected ? 'Connected' : 'Disconnected' }}
        </button>
      </div>
    </section>
    <router-outlet></router-outlet>
  </main>

  <app-mobile-nav class="mobile-nav-area mobile-only"></app-mobile-nav>

</div>
