<div class="auth-wrapper">
  <div class="login-card glass-card">
    <div class="auth-header">
      <div class="logo-circle">A</div>
      <h2>APEX TERMINAL</h2>
      <p>Secure Biometric or Password Entry</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="input-field">
        <label>Username</label>
        <input type="text" [(ngModel)]="form.username" name="user" required>
      </div>

      <div class="input-field">
        <label>Access Key</label>
        <input type="password" [(ngModel)]="form.password" name="pass" required>
      </div>

      <button type="submit" class="btn-login" [disabled]="loading">
        {{ loading ? 'AUTHENTICATING...' : 'ENTER SYSTEM' }}
      </button>
    </form>

    <div class="security-footer">
      <i class="icon-shield"></i> 256-bit AES Encrypted Session
    </div>
  </div>
</div>
