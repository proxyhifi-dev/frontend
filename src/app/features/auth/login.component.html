<div class="auth-container">
  <div class="auth-card glass-card">
    <div class="auth-header">
      <span class="logo">APEX ⚡</span>
      <h2>Welcome back</h2>
      <p>Sign in to continue tracking your trades.</p>
    </div>
    <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" [(ngModel)]="form.email" name="email" class="dark-input" placeholder="Enter email" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" [(ngModel)]="form.password" name="password" class="dark-input" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <button type="submit" [disabled]="loginForm.invalid || loading" class="btn btn-primary btn-block">Login</button>
    </form>
    <div class="auth-divider">
      <span>or</span>
    </div>
    <button (click)="loginWithFyers()" [disabled]="loading" class="btn btn-outline btn-block">Login with Fyers</button>
    <p class="text-center mt-3">Don't have an account? <a routerLink="/auth/register">Register here</a></p>
  </div>
</div>
