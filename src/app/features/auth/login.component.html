<div class="auth-container">
  <div class="auth-card glass-card">
    <div class="auth-header">
      <span class="logo">APEX ⚡</span>
      <h2>Welcome back</h2>
      <p>Sign in to continue tracking your trades.</p>
    </div>
    <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" [(ngModel)]="form.email" name="email" class="dark-input" placeholder="Enter email" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" [(ngModel)]="form.password" name="password" class="dark-input" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <button type="submit" [disabled]="loginForm.invalid || loading" class="btn btn-primary btn-block">Login</button>
    </form>
    <div class="auth-divider">
      <span>or</span>
    </div>
    <button (click)="loginWithFyers()" [disabled]="loading || fyersLoading" class="btn btn-outline btn-block">
      {{ fyersLoading ? 'Connecting to FYERS...' : 'Login with Fyers' }}
    </button>
    <p class="status-text" *ngIf="fyersStatus">{{ fyersStatus }}</p>

    <div class="dev-login" *ngIf="isDevMode">
      <div class="auth-divider">
        <span>dev login</span>
      </div>
      <form #devFormRef="ngForm" (ngSubmit)="devLogin()">
        <div class="form-group">
          <label for="dev-username">Username</label>
          <input
            id="dev-username"
            type="text"
            [(ngModel)]="devForm.username"
            name="devUsername"
            class="dark-input"
            placeholder="dev-user"
            required
          >
        </div>
        <div class="form-group">
          <label for="dev-password">Password (optional)</label>
          <input
            id="dev-password"
            type="password"
            [(ngModel)]="devForm.password"
            name="devPassword"
            class="dark-input"
            placeholder="optional"
          >
        </div>
        <button type="submit" [disabled]="devFormRef.invalid || loading" class="btn btn-secondary btn-block">
          Dev Login
        </button>
      </form>
    </div>
    <p class="text-center mt-3">Don't have an account? <a routerLink="/auth/register">Register here</a></p>
  </div>
</div>
