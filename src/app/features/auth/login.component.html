<div class="auth-container">
  <div class="auth-card">
    <h2>Login</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" [(ngModel)]="form.username" name="username" class="form-control" placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="form.password" name="password" class="form-control" placeholder="Enter password">
      </div>
      <button type="submit" [disabled]="loading" class="btn btn-primary btn-block">Login</button>
    </form>
    <hr>
    <button (click)="loginWithFyers()" [disabled]="loading" class="btn btn-info btn-block">Login with Fyers</button>
    <p class="text-center mt-3">Don't have an account? <a href="/register">Register here</a></p>
  </div>
</div>
