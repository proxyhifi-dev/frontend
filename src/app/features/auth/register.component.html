<div class="auth-container">
  <div class="auth-card">
    <h2>Create Account</h2>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="form.email" name="email" class="form-control" placeholder="Enter email">
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" [(ngModel)]="form.username" name="username" class="form-control" placeholder="Choose username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="form.password" name="password" class="form-control" placeholder="Enter password">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="form.confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm password">
      </div>
      <button type="submit" [disabled]="loading" class="btn btn-primary btn-block">Register</button>
    </form>
    <p class="text-center mt-3">Already have an account? <a href="/login">Login here</a></p>
  </div>
</div>
