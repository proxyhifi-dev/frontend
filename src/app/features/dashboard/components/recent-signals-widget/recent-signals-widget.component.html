<div class="glass-card widget">
  <div class="widget-header">
    <h3>Scanner Output</h3>
    <span class="scan-timer">Next scan: 45s</span>
  </div>

  <div class="signal-list">
    <div class="signal-card" *ngFor="let signal of signals">
      <div class="signal-main">
        <div class="symbol-info">
          <h4>{{ signal.symbol }}</h4>
          <span class="grade" [attr.data-grade]="signal.grade">{{ signal.grade }}</span>
        </div>
        <div class="score-circle">
          <svg viewBox="0 0 36 36" class="circular-chart">
            <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path class="circle" [attr.stroke-dasharray]="signal.score + ', 100'" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <div class="percentage">{{ signal.score }}</div>
        </div>
      </div>

      <div class="layer-stats">
        <span>VWAP: {{ signal.layerScores.vwap }}/5</span>
        <span>RSI: {{ signal.layerScores.rsi }}</span>
        <span>ADX: {{ signal.layerScores.adx }}</span>
      </div>

      <div class="actions">
        <button class="btn-approve">APPROVE</button>
        <button class="btn-reject">REJECT</button>
      </div>
    </div>
  </div>
</div>
