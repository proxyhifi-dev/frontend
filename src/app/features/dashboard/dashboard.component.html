<div *ngIf="isLoading" class="loading-overlay">
  <div class="spinner-container">
    <div class="spinner"></div>
    <p>Connecting to Market Data Feed...</p>
  </div>
</div>

<div *ngIf="!isLoading" class="dashboard-container">

  <div class="kpi-row">
    <app-kpi-card
      title="TODAY P&L"
      [value]="stats.todayPnL"
      prefix="₹"
      [percentChange]="0">
    </app-kpi-card>

    <app-kpi-card
      title="WEEKLY P&L"
      [value]="stats.weeklyPnL"
      prefix="₹"
      [percentChange]="0">
    </app-kpi-card>

    <app-kpi-card
      title="MONTHLY P&L"
      [value]="stats.monthlyPnL"
      prefix="₹"
      [percentChange]="0">
    </app-kpi-card>

    <app-kpi-card
      title="TOTAL P&L"
      [value]="stats.totalPnL"
      prefix="₹"
      [percentChange]="stats.roi">
    </app-kpi-card>
  </div>

  <div class="dashboard-grid">
    <div class="left-column">
      <app-equity-curve-chart [data]="equityData"></app-equity-curve-chart>
      <app-positions-widget [positions]="activePositions"></app-positions-widget>
    </div>

    <div class="right-column">
      <app-welcome-wizard *ngIf="(onboarding.isNewUser$ | async)"></app-welcome-wizard>
      <div class="status-header glass-card">
        <div class="status-item">
          <label>BOT STATUS</label>
          <span class="active-dot">⚫ ACTIVE</span>
        </div>
        <div class="status-item">
          <label>Mode</label>
          <span class="mode-badge">{{ (store.state$ | async)?.isLiveMode ? 'LIVE' : 'PAPER' }}</span>
        </div>
        <div class="status-item">
          <label>Signals</label>
          <span>{{ newSignals.length }} New</span>
        </div>
        <button class="btn-pause">⏸ Pause</button>
      </div>

      <app-recent-signals-widget [signals]="newSignals"></app-recent-signals-widget>
    </div>
  </div>
</div>
