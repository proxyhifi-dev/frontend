<!-- ✅ Loading Overlay -->
<div *ngIf="isLoading" class="loading-overlay">
  <div class="loading-spinner">
    <div class="spinner"></div>
    <p class="loading-text">Connecting to Market Data Feed...</p>
    <p class="loading-subtext">Backend: http://127.0.0.1:8080</p>
  </div>
</div>

<!-- ✅ Dashboard Content (Hidden while loading) -->
<div *ngIf="!isLoading" class="dashboard-container">

  <!-- KPI Cards Row -->
  <div class="kpi-row">
    <app-kpi-card
      title="Today P&L"
      [value]="stats.todayPnL"
      prefix="₹"
      [isPositive]="stats.todayPnL >= 0">
    </app-kpi-card>

    <app-kpi-card
      title="Unrealized P&L"
      [value]="stats.unrealizedPnL"
      prefix="₹"
      [isPositive]="stats.unrealizedPnL >= 0">
    </app-kpi-card>

    <app-kpi-card
      title="Win Rate"
      [value]="stats.winRate"
      prefix="%">
    </app-kpi-card>

    <app-kpi-card
      title="ROI"
      [value]="stats.roi"
      prefix="%"
      [isPositive]="stats.roi >= 0">
    </app-kpi-card>
  </div>

  <!-- Dashboard Grid -->
  <div class="dashboard-grid">

    <!-- Left Column -->
    <div class="left-column">
      <app-equity-curve-chart
        [data]="equityData"
        title="Equity Curve">
      </app-equity-curve-chart>

      <app-positions-widget
        [positions]="activePositions"
        title="Open Positions">
      </app-positions-widget>
    </div>

    <!-- Right Column -->
    <div class="right-column">
      <app-circuit-breaker></app-circuit-breaker>

      <app-recent-signals-widget
        [signals]="newSignals"
        title="Recent Signals">
      </app-recent-signals-widget>
    </div>
  </div>
</div>
