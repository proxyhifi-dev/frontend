# Step 1: Build Angular
FROM node:18 as build
WORKDIR /app
COPY package*.json ./
RUN npm install
COPY . .
RUN npm run build --prod

  # Step 2: Serve with Nginx
FROM nginx:alpine
COPY --from=build /app/dist/apex-trading-bot /usr/share/nginx/html
COPY nginx.conf /etc/nginx/conf.d/default.conf
EXPOSE 80
