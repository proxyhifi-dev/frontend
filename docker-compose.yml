version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    image: apex-trading-bot:latest
    ports:
      - "8081:8080"
    environment:
      - APEX_ALLOWED_ORIGINS=http://localhost:8080
